onboarding = false
[keys]
prefix = "ctrl+e"
focus_pane_up = "prefix+u"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_agent = "alt+k"
next_agent = "alt+j"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "down"
navigate_pane_up = "up"

[theme]
name = "catppuccin-latte"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
